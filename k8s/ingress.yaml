apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: davidbreau
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /davidbreau(/|$)(.*) 
        pathType: ImplementationSpecific
        backend:
          service:
            name: streamlit-service
            port:
              number: 8501